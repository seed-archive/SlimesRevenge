name: Test

# Temporarily off by Oleg's decision 2026-11-26: manual runs only.
# Restore the push/pull_request triggers below and the required checks
# ("test / Test", "Format") on dev when gameplay code lands.
#   push: { branches: [dev] }
#   pull_request: { branches: [main, dev], types: [opened, synchronize, reopened] }
on:
  workflow_dispatch:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  test:
    uses: ./.github/workflows/unity-editmode.yml
    secrets: inherit

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - run: ./scripts/format.sh check
