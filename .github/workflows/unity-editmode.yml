name: Unity EditMode

on:
  workflow_call:

env:
  UNITY_VERSION: 6000.5.10f1

permissions:
  contents: read
  checks: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false

      - uses: actions/cache@v6
        with:
          path: Library
          key: Library-test-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-test-

      # Pinned to the v4 build that last activated our Personal license (run 32937797781, 2026-08-26).
      # The later v4 build (32e5771) switched to the license-file method, which Unity rejects
      # with "TimeStamp validation failed".
      - uses: game-ci/unity-test-runner@0ff419b913a3630032cbe0de48a0099b5a9f0ed9
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          customImage: unityci/editor:ubuntu-6000.5.10f1-base-3
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Test-results
          path: artifacts
